<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수창 포트폴리오 상황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#0B0E14; --panel:#141924; --panel-2:#1A2130; --line:#242D3E;
  --text:#D6DDEA; --muted:#6B7789; --amber:#F0B429;
  --up:#FF4D4D; --down:#4B8DF8;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Pretendard',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;padding-bottom:48px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

/* 상단 바 */
.topbar{position:sticky;top:0;z-index:10;background:rgba(11,14,20,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:12px 16px;flex-wrap:wrap}
.brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--text);letter-spacing:.04em;text-transform:none;font-weight:700}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
.stamp .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--amber);margin-right:6px;vertical-align:middle}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
section{margin-top:28px}
h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
   font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* 히어로 */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:24px 22px;margin-top:22px}
.hero-label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.hero-value{font-family:var(--mono);font-size:clamp(32px,8vw,54px);font-weight:700;
  line-height:1.05;margin:6px 0 2px;letter-spacing:-.02em}
.hero-sub{font-family:var(--mono);font-size:15px;font-weight:700}
.gauge{margin-top:18px}
.gauge-track{position:relative;height:26px;background:var(--panel-2);
  border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.gauge-cost{position:absolute;inset:0 auto 0 0;background:#2C3546}
.gauge-val{position:absolute;inset:0 auto 0 0;opacity:.85}
.gauge-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--amber)}
.gauge-legend{display:flex;justify-content:space-between;margin-top:7px;
  font-family:var(--mono);font-size:11px;color:var(--muted)}

/* 테이블 */
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
   text-align:right;padding:0 10px 8px;font-weight:700}
th:first-child{text-align:left}
td{padding:11px 10px;border-top:1px solid var(--line);text-align:right;font-size:14px}
td:first-child{text-align:left}
tbody tr:hover{background:var(--panel)}
.nm{font-weight:600}
.tk{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:2px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px 6px 6px}

/* 매크로 스트립 */
.macro{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.macro div{background:var(--panel);padding:14px 14px 12px}
.macro .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.macro .v{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:4px}
.macro .c{font-family:var(--mono);font-size:12px;margin-top:2px}

/* paperbot */
.bot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.bot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;margin-top:12px}
.bot-grid .k{font-size:11px;color:var(--muted)}
.bot-grid .v{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:3px}
.stale{color:var(--amber);font-size:12px;font-family:var(--mono);margin-top:12px}

footer{margin-top:32px;font-size:11px;color:var(--muted);line-height:1.7;
  border-top:1px solid var(--line);padding-top:14px}
.err{color:var(--amber);font-family:var(--mono);font-size:13px;padding:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px}
@media (prefers-reduced-motion:no-preference){
  .hero,.scroll,.macro,.bot{animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Portfolio <b>상황판</b></div>
  <div class="stamp" id="stamp"><span class="dot"></span>불러오는 중…</div>
</div>

<div class="wrap">
  <div id="root"></div>
  <footer>
    시세 출처: Yahoo Finance · 약 15~20분 지연된 값이라 실시간 체결가와 다르다.<br>
    상승은 빨강, 하락은 파랑 (국내 증시 표기 기준). 투자 판단은 본인 책임.
  </footer>
</div>

<script>
const won = n => Math.round(n).toLocaleString('ko-KR');
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
const sign = n => (n > 0 ? '+' : '') + n.toFixed(2);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function fmtPrice(v, ticker) {
  const d = (ticker && ticker.endsWith('.KS')) || v >= 1000 ? 0 : 2;
  return v.toLocaleString('ko-KR', {minimumFractionDigits: d, maximumFractionDigits: d});
}

function stamp(iso) {
  const t = new Date(iso);
  const mins = Math.round((Date.now() - t) / 60000);
  const ago = mins < 1 ? '방금' : mins < 60 ? `${mins}분 전` : `${Math.floor(mins/60)}시간 전`;
  document.getElementById('stamp').innerHTML =
    `<span class="dot"></span>${t.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})} 기준 · ${ago} 갱신`;
}

function positions(rows) {
  if (!rows.length) return '';
  const tr = rows.map(r => `<tr>
    <td><span class="nm">${esc(r.name)}</span><span class="tk">${esc(r.ticker)}</span></td>
    <td class="num">${fmtPrice(r.avg, r.ticker)}</td>
    <td class="num">${fmtPrice(r.price, r.ticker)}</td>
    <td class="num ${cls(r.pct)}">${sign(r.pct)}%</td>
    <td class="num ${cls(r.pnl_pct)}">${sign(r.pnl_pct)}%</td>
  </tr>`).join('');
  return `<section><h2>보유 종목</h2><div class="scroll"><table>
    <thead><tr><th>종목</th><th>평단</th><th>현재가</th><th>전일비</th><th>수익률</th></tr></thead>
    <tbody>${tr}</tbody></table></div></section>`;
}

function watchlist(rows) {
  if (!rows.length) return '';
  const tr = rows.map(r => `<tr>
    <td><span class="nm">${esc(r.name)}</span><span class="tk">${esc(r.ticker)}</span></td>
    <td class="num">${fmtPrice(r.price, r.ticker)}</td>
    <td class="num ${cls(r.change)}">${r.change >= 0 ? '+' : ''}${fmtPrice(r.change, r.ticker)}</td>
    <td class="num ${cls(r.pct)}">${sign(r.pct)}%</td>
  </tr>`).join('');
  return `<section><h2>관심 종목</h2><div class="scroll"><table>
    <thead><tr><th>종목</th><th>현재가</th><th>전일비</th><th>등락률</th></tr></thead>
    <tbody>${tr}</tbody></table></div></section>`;
}

function macro(rows) {
  if (!rows.length) return '';
  const cards = rows.map(r => `<div>
    <div class="k">${esc(r.name)}</div>
    <div class="v">${r.price.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
    <div class="c ${cls(r.pct)}">${sign(r.pct)}%</div>
  </div>`).join('');
  return `<section><h2>지수 · 환율 · 원자재</h2><div class="macro">${cards}</div></section>`;
}

function bot(d) {
  if (!d) return `<section><h2>paperbot 성과</h2><div class="bot">
    <div class="stale">아직 노트북에서 요약본을 올린 적이 없다. 노트북에서 push_paperbot_summary.py를 한 번 실행하면 여기에 표시된다.</div>
  </div></section>`;
  const t = new Date(d.generated_at);
  const hrs = (Date.now() - t) / 3600000;
  const warn = hrs > 12
    ? `<div class="stale">노트북 요약본이 ${Math.floor(hrs)}시간째 그대로다. 노트북이 꺼져 있거나 봇이 멈췄을 수 있다.</div>` : '';
  return `<section><h2>paperbot 성과</h2><div class="bot">
    <div style="font-size:12px;color:var(--muted)">${esc(d.mode||'live-mock')} · ${t.toLocaleString('ko-KR')} 기준</div>
    <div class="bot-grid">
      <div><div class="k">누적 매매</div><div class="v">${d.trades}건</div></div>
      <div><div class="k">승률</div><div class="v">${d.win_rate.toFixed(1)}%</div></div>
      <div><div class="k">누적 손익률</div><div class="v ${cls(d.total_return)}">${sign(d.total_return)}%</div></div>
      <div><div class="k">MDD</div><div class="v ${cls(d.mdd)}">${d.mdd.toFixed(2)}%</div></div>
    </div>${warn}
  </div></section>`;
}

async function load() {
  let m;
  try {
    const res = await fetch('./data/market.json?t=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    m = await res.json();
  } catch (e) {
    document.getElementById('root').innerHTML =
      `<section><div class="err">시세 파일을 못 읽었다 (${esc(e.message)}).
       GitHub Actions가 아직 한 번도 안 돌았거나 실패했을 수 있다.
       레포의 Actions 탭에서 실행 기록을 확인해라.</div></section>`;
    document.getElementById('stamp').innerHTML = '<span class="dot"></span>불러오기 실패';
    return;
  }

  let b = null;
  try {
    const res = await fetch('./data/paperbot.json?t=' + Date.now());
    if (res.ok) b = await res.json();
  } catch (_) {}

  stamp(m.generated_at);
  document.getElementById('root').innerHTML =
    positions(m.portfolio.positions) +
    watchlist(m.watchlist) + macro(m.macro) + bot(b);
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
