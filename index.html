<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수창 포트폴리오 상황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#0B0E14; --panel:#141924; --panel-2:#1A2130; --line:#242D3E;
  --text:#D6DDEA; --muted:#6B7789; --amber:#F0B429;
  --up:#FF4D4D; --down:#4B8DF8;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Pretendard',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;padding-bottom:48px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

/* 상단 바 */
.topbar{position:sticky;top:0;z-index:10;background:rgba(11,14,20,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:12px 16px;flex-wrap:wrap}
.brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--text);letter-spacing:.04em;text-transform:none;font-weight:700}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
.stamp .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--amber);margin-right:6px;vertical-align:middle}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
section{margin-top:28px}
h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
   font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

.nm{font-weight:600}
.tk{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:2px}

/* 종목/매크로 차트 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.stock-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 16px 12px}
.stock-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stock-metrics{text-align:right;display:flex;flex-direction:column;gap:2px}
.stock-metrics .num{font-size:15px}
.stock-metrics .pnl{font-size:12px}
.chart{margin-top:12px}
.spark{width:100%;height:64px;display:block}
.spark-range{display:flex;justify-content:space-between;margin-top:4px;
  font-family:var(--mono);font-size:10px;color:var(--muted)}
.chart-empty{height:64px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px}
.stock-card.clickable{cursor:pointer;transition:border-color .15s}
.stock-card.clickable:hover{border-color:var(--amber)}

/* 확대 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(5,7,11,.72);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;width:100%;max-width:820px;max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal-close{background:none;border:1px solid var(--line);color:var(--muted);
  font-size:14px;width:28px;height:28px;border-radius:8px;cursor:pointer;flex:none}
.modal-tabs{display:flex;gap:8px;margin-top:16px}
.modal-tabs button{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
  border-radius:8px;padding:6px 16px;font-size:13px;font-family:var(--sans);cursor:pointer}
.modal-tabs button.active{color:var(--ink);background:var(--amber);border-color:var(--amber);font-weight:700}
.modal-chart-wrap{margin-top:16px}
.big-chart{width:100%;height:300px;display:block}
.big-chart-labels{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:11px;color:var(--muted);margin-top:6px}
.modal-meta{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* paperbot */
.bot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.bot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;margin-top:12px}
.bot-grid .k{font-size:11px;color:var(--muted)}
.bot-grid .v{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:3px}
.bot-sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.bot-sub .k{font-size:11px;color:var(--muted)}
.bot-sub .v{font-family:var(--mono);font-size:14px;margin-top:2px}
.bot-chart{width:100%;height:130px;display:block;margin-top:6px}
.bot-block{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.bot-block h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:10px}

/* 청산 사유별 기여도 */
.reason{display:grid;grid-template-columns:96px 108px 1fr 62px;align-items:center;
  gap:10px;padding:5px 0;font-size:12px}
.reason .rn{font-weight:600}
.reason .rc{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.reason .bar{height:8px;background:var(--panel-2);border-radius:4px;position:relative}
.reason .bar i{position:absolute;top:0;height:8px;border-radius:4px;display:block}
.reason .rv{font-family:var(--mono);text-align:right}

/* 최근 매매 */
.trades{width:100%;border-collapse:collapse;font-size:12px}
.trades td{padding:6px 4px;border-top:1px solid var(--line);white-space:nowrap}
.trades tr:first-child td{border-top:none}
.trades .t-num{font-family:var(--mono);text-align:right}
.trades .t-why{color:var(--muted);width:99%}   /* 남는 가로폭을 흡수해 나머지 칸을 붙인다 */
.trades .t-date,.trades .t-hold{font-family:var(--mono);color:var(--muted);font-size:11px}

.stale{color:var(--amber);font-size:12px;font-family:var(--mono);margin-top:12px}
@media (max-width:520px){
  .reason{grid-template-columns:80px 1fr 58px}
  .reason .rc{display:none}
  .trades .t-hold{display:none}
}

footer{margin-top:32px;font-size:11px;color:var(--muted);line-height:1.7;
  border-top:1px solid var(--line);padding-top:14px}
.err{color:var(--amber);font-family:var(--mono);font-size:13px;padding:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px}
@media (prefers-reduced-motion:no-preference){
  .stock-card,.bot{animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Portfolio <b>상황판</b></div>
  <div class="stamp" id="stamp"><span class="dot"></span>불러오는 중…</div>
</div>

<div class="wrap">
  <div id="root"></div>
  <footer>
    시세 출처: Yahoo Finance · 약 15~20분 지연된 값이라 실시간 체결가와 다르다.<br>
    상승은 빨강, 하락은 파랑 (국내 증시 표기 기준). 투자 판단은 본인 책임.
  </footer>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <div><span class="nm" id="modalTitle" style="font-size:16px"></span>
        <span class="tk" id="modalTicker"></span></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-tabs">
      <button data-tf="minute" onclick="setTf('minute')">분봉</button>
      <button data-tf="daily" onclick="setTf('daily')">일봉</button>
      <button data-tf="weekly" onclick="setTf('weekly')">주봉</button>
    </div>
    <div class="modal-chart-wrap" id="modalChart"></div>
    <div class="modal-meta" id="modalMeta"></div>
  </div>
</div>

<script>
const won = n => Math.round(n).toLocaleString('ko-KR');
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
const sign = n => (n > 0 ? '+' : '') + n.toFixed(2);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function fmtPrice(v, ticker) {
  const d = (ticker && ticker.endsWith('.KS')) || v >= 1000 ? 0 : 2;
  return v.toLocaleString('ko-KR', {minimumFractionDigits: d, maximumFractionDigits: d});
}

function stamp(iso) {
  const t = new Date(iso);
  const mins = Math.round((Date.now() - t) / 60000);
  const ago = mins < 1 ? '방금' : mins < 60 ? `${mins}분 전` : `${Math.floor(mins/60)}시간 전`;
  document.getElementById('stamp').innerHTML =
    `<span class="dot"></span>${t.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})} 기준 · ${ago} 갱신`;
}

function sparkline(history) {
  if (!history || history.length < 2) return '<div class="chart-empty">차트 데이터 없음</div>';
  const w = 320, h = 64, pad = 4;
  const closes = history.map(d => d.close);
  const min = Math.min(...closes), max = Math.max(...closes);
  const range = (max - min) || 1;
  const stepX = (w - pad * 2) / (closes.length - 1);
  const points = closes.map((c, i) => {
    const x = pad + i * stepX;
    const y = pad + (1 - (c - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const up = closes[closes.length - 1] >= closes[0];
  const color = up ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>
    <div class="spark-range"><span>${esc(history[0].date)}</span><span>${esc(history[history.length - 1].date)}</span></div>`;
}

let currentPositions = [];
let modalIdx = null;
let modalTf = 'daily';

function bigChart(series) {
  if (!series || series.length < 2) return '<div class="chart-empty" style="height:300px">차트 데이터 없음</div>';
  const w = 760, h = 300, pad = 20;
  const closes = series.map(d => d.close);
  const min = Math.min(...closes), max = Math.max(...closes);
  const range = (max - min) || 1;
  const stepX = (w - pad * 2) / (closes.length - 1);
  const points = closes.map((c, i) => {
    const x = pad + i * stepX;
    const y = pad + (1 - (c - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const up = closes[closes.length - 1] >= closes[0];
  const color = up ? 'var(--up)' : 'var(--down)';
  return `<svg class="big-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>
    <div class="big-chart-labels">
      <span>최고 ${max.toLocaleString('ko-KR',{maximumFractionDigits:2})}</span>
      <span>최저 ${min.toLocaleString('ko-KR',{maximumFractionDigits:2})}</span>
    </div>`;
}

function renderModal() {
  const r = currentPositions[modalIdx];
  if (!r) return;
  document.getElementById('modalTitle').textContent = r.name;
  document.getElementById('modalTicker').textContent = r.ticker;
  document.querySelectorAll('.modal-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.tf === modalTf);
  });
  const series = (r.chart && r.chart[modalTf]) || [];
  document.getElementById('modalChart').innerHTML = bigChart(series);
  document.getElementById('modalMeta').textContent = series.length
    ? `${series[0].date} ~ ${series[series.length - 1].date} · 현재가 ${fmtPrice(r.price, r.ticker)} · 보유 수익률 ${sign(r.pnl_pct)}%`
    : '해당 구간 데이터 없음';
}

function openModal(idx) {
  modalIdx = idx;
  modalTf = 'daily';
  renderModal();
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function setTf(tf) {
  modalTf = tf;
  renderModal();
}

function positions(rows) {
  currentPositions = rows;
  if (!rows.length) return '';
  const cards = rows.map((r, i) => `<div class="stock-card clickable" onclick="openModal(${i})">
    <div class="stock-head">
      <div><span class="nm">${esc(r.name)}</span><span class="tk">${esc(r.ticker)}</span></div>
      <div class="stock-metrics">
        <span class="num">${fmtPrice(r.price, r.ticker)}</span>
        <span class="num ${cls(r.pct)}">${sign(r.pct)}%</span>
        <span class="num pnl ${cls(r.pnl_pct)}">수익률 ${sign(r.pnl_pct)}%</span>
      </div>
    </div>
    <div class="chart">${sparkline(r.chart && r.chart.daily)}</div>
  </div>`).join('');
  return `<section><h2>보유 종목 <span style="text-transform:none;font-weight:400;letter-spacing:0">(클릭하면 확대)</span></h2><div class="cards">${cards}</div></section>`;
}

function macro(rows) {
  if (!rows.length) return '';
  const cards = rows.map(r => `<div class="stock-card">
    <div class="stock-head">
      <div><span class="nm">${esc(r.name)}</span></div>
      <div class="stock-metrics">
        <span class="num">${r.price.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
        <span class="num ${cls(r.pct)}">${sign(r.pct)}%</span>
      </div>
    </div>
    <div class="chart">${sparkline(r.history)}</div>
  </div>`).join('');
  return `<section><h2>지수 · 환율 · 원자재</h2><div class="cards">${cards}</div></section>`;
}

function equityChart(points) {
  if (!points || points.length < 2) return '<div class="chart-empty">자산곡선 데이터 부족</div>';
  const w = 720, h = 130, pad = 10;
  const vals = points.map(p => p.close);
  const min = Math.min(100, ...vals), max = Math.max(100, ...vals);
  const range = (max - min) || 1;
  const y = v => pad + (1 - (v - min) / range) * (h - pad * 2);
  const stepX = (w - pad * 2) / (vals.length - 1);
  const pts = vals.map((v, i) => `${(pad + i * stepX).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = vals[vals.length - 1];
  const color = last >= 100 ? 'var(--up)' : 'var(--down)';
  const base = y(100).toFixed(1);
  return `<svg class="bot-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polygon points="${pad},${base} ${pts} ${w - pad},${base}" fill="${color}" opacity=".13"/>
      <line x1="${pad}" y1="${base}" x2="${w - pad}" y2="${base}"
            stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>
    <div class="spark-range">
      <span>${esc(points[0].date)} · 시작 100</span>
      <span>${esc(points[points.length - 1].date)} · ${last.toFixed(2)}</span>
    </div>`;
}

// 청산 사유별 기여도 — 0을 가운데 두고 좌(손실)/우(이익)로 뻗는 막대
function reasonRows(rows) {
  if (!rows || !rows.length) return '';
  const scale = Math.max(...rows.map(r => Math.abs(r.contribution)), 0.01);
  const bars = rows.map(r => {
    const w = Math.abs(r.contribution) / scale * 50;
    const s = r.contribution >= 0
      ? `left:50%;width:${w}%;background:var(--up)`
      : `right:50%;width:${w}%;background:var(--down)`;
    return `<div class="reason">
      <span class="rn">${esc(r.reason)}</span>
      <span class="rc">${r.n}건 · 승률 ${r.win_rate}%</span>
      <span class="bar"><i style="${s}"></i></span>
      <span class="rv ${cls(r.contribution)}">${sign(r.contribution)}%</span>
    </div>`;
  }).join('');
  return `<div class="bot-block"><h3>청산 사유별 기여도 (시드 대비)</h3>${bars}</div>`;
}

function tradeRows(rows) {
  if (!rows || !rows.length) return '';
  const tr = rows.map(r => `<tr>
    <td class="t-date">${esc(r.date.slice(5))}</td>
    <td class="nm">${esc(r.name || r.ticker)}</td>
    <td class="t-why">${esc(r.exit_reason)}</td>
    <td class="t-hold">${r.hold_min == null ? '' : r.hold_min + '분'}</td>
    <td class="t-num ${cls(r.pnl_pct)}">${sign(r.pnl_pct)}%</td>
  </tr>`).join('');
  return `<div class="bot-block"><h3>최근 매매</h3><table class="trades">${tr}</table></div>`;
}

function bot(d) {
  if (!d) return `<section><h2>paperbot 성과</h2><div class="bot">
    <div class="stale">아직 노트북에서 요약본을 올린 적이 없다. 노트북에서
      <code>python scripts/push_paperbot_summary.py --push</code>를 한 번 실행하면 여기에 표시된다.</div>
  </div></section>`;
  const t = new Date(d.generated_at);
  const hrs = (Date.now() - t) / 3600000;
  const warn = hrs > 12
    ? `<div class="stale">노트북 요약본이 ${Math.floor(hrs)}시간째 그대로다. 노트북이 꺼져 있거나 봇이 멈췄을 수 있다.</div>` : '';
  const per = d.period ? ` · ${d.period.from} ~ ${d.period.to} (${d.period.days}거래일)` : '';
  const today = d.today
    ? `${d.today.date.slice(5)} ${d.today.trades}건 <span class="${cls(d.today['return'])}">${sign(d.today['return'])}%</span>`
    : '-';
  return `<section><h2>paperbot 성과</h2><div class="bot">
    <div style="font-size:12px;color:var(--muted)">${esc(d.mode || 'live-mock')}${per}</div>
    <div class="bot-grid">
      <div><div class="k">누적 매매</div><div class="v">${d.trades}건</div></div>
      <div><div class="k">승률</div><div class="v">${d.win_rate.toFixed(1)}%</div></div>
      <div><div class="k">누적 손익률 (시드 대비)</div><div class="v ${cls(d.total_return)}">${sign(d.total_return)}%</div></div>
      <div><div class="k">MDD</div><div class="v ${cls(d.mdd)}">${d.mdd.toFixed(2)}%</div></div>
    </div>
    <div class="bot-sub">
      <div><div class="k">가격 손익</div><div class="v ${cls(d.gross_return)}">${sign(d.gross_return)}%</div></div>
      <div><div class="k">수수료·세금</div><div class="v down">${sign(d.cost_return)}%</div></div>
      <div><div class="k">평균 익절</div><div class="v up">${sign(d.avg_win)}%</div></div>
      <div><div class="k">평균 손절</div><div class="v down">${sign(d.avg_loss)}%</div></div>
      <div><div class="k">최근 매매일</div><div class="v">${today}</div></div>
    </div>
    <div class="bot-block"><h3>자산곡선 (시드 = 100)</h3>${equityChart(d.equity)}</div>
    ${reasonRows(d.by_reason)}
    ${tradeRows(d.recent)}
    <div style="font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6">
      모의투자(paper) 계좌 기준. 손익률은 전부 수수료 0.7% + 거래세 0.2%를 뺀 순손익이고,
      금액은 공개하지 않고 시드 대비 %만 표시한다. ${t.toLocaleString('ko-KR')} 기준.
    </div>${warn}
  </div></section>`;
}

async function load() {
  let m;
  try {
    const res = await fetch('./data/market.json?t=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    m = await res.json();
  } catch (e) {
    document.getElementById('root').innerHTML =
      `<section><div class="err">시세 파일을 못 읽었다 (${esc(e.message)}).
       GitHub Actions가 아직 한 번도 안 돌았거나 실패했을 수 있다.
       레포의 Actions 탭에서 실행 기록을 확인해라.</div></section>`;
    document.getElementById('stamp').innerHTML = '<span class="dot"></span>불러오기 실패';
    return;
  }

  let b = null;
  try {
    const res = await fetch('./data/paperbot.json?t=' + Date.now());
    if (res.ok) b = await res.json();
  } catch (_) {}

  stamp(m.generated_at);
  document.getElementById('root').innerHTML =
    positions(m.portfolio.positions) + macro(m.macro) + bot(b);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
